<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CHAPATRON — Catálogo de Robôs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  @page { size: A4; margin: 0; }
  html { background: #1a1030; }
  #root { padding: 7mm 8mm; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  * { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { margin: 0; background: #1a1030; color: #f4eeff; font-family: Nunito, sans-serif; }
  .cover { text-align: center; padding: 18px 0 10px; }
  .cover h1 { font: 34px Bungee, sans-serif; margin: 0; color: #9bff5d; letter-spacing: 1px; }
  .cover p { margin: 4px 0 0; color: #c8b8e8; font-weight: 800; font-size: 13px; }
  .legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 14px; margin: 10px 0 4px; font-size: 11px; color: #d8c8f8; font-weight: 800; }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }
  .legend img { width: 16px; height: 16px; }
  .newtraits { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0 6px; }
  .nt { border-radius: 10px; padding: 8px 10px; background: rgba(255,255,255,.05); border: 1px solid var(--c); }
  .nt b { display: flex; align-items: center; gap: 6px; font: 13px Bungee, sans-serif; color: var(--c); }
  .nt b img { width: 22px; height: 22px; }
  .nt small { display: block; font-size: 10.5px; color: #d8c8f8; margin-top: 3px; line-height: 1.3; font-weight: 700; }
  .nt em { font-style: normal; font-size: 10px; color: #a898c8; }
  h2 { font: 17px Bungee, sans-serif; margin: 14px 0 6px; padding: 4px 10px; border-radius: 8px; color: #1a1030; background: var(--cc); break-after: avoid; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
  .card { position: relative; border-radius: 10px; overflow: hidden; background: #241a40; border: 2px solid var(--cc); break-inside: avoid; }
  .card img.pt { display: block; width: 100%; aspect-ratio: 26/20; object-fit: cover; background: radial-gradient(circle at 50% 40%, #3a2a60, #1e1636); }
  .card .new { position: absolute; top: 5px; left: 5px; font: 9px Bungee, sans-serif; background: #b6ff3d; color: #1a1030; padding: 2px 6px; border-radius: 6px; }
  .card .cost { position: absolute; top: 5px; right: 5px; font: 11px Bungee, sans-serif; background: var(--cc); color: #1a1030; padding: 1px 6px; border-radius: 6px; }
  .info { padding: 5px 7px 7px; }
  .name { font: 12.5px Bungee, sans-serif; color: #fff; line-height: 1.15; }
  .role { display: flex; align-items: center; gap: 4px; margin-top: 3px; font-size: 11px; font-weight: 900; color: var(--rc); }
  .role img { width: 14px; height: 14px; }
  .traits { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 4px; }
  .traits span { display: inline-flex; align-items: center; gap: 3px; font-size: 10px; font-weight: 800; padding: 1px 6px 1px 3px; border-radius: 999px; background: rgba(255,255,255,.07); color: var(--tc); }
  .traits img { width: 13px; height: 13px; }
  .ab { margin-top: 4px; font-size: 9.5px; color: #a898c8; font-weight: 700; }
  #status { position: fixed; bottom: 8px; right: 8px; font-size: 11px; color: #8f80b0; }
  @media print { #status { display: none; } }
</style>
</head>
<body>
  <div id="root"></div>
  <div id="status">gerando retratos…</div>
  <script type="module" src="/src/catalog.ts"></script>
</body>
</html>
